name: Probe K-Startup (temporary)
# 임시(2차): K-Startup 모집중 목록이 지금 어떤 구조로 오는지 확인한다(창업진흥원 수집이 계속 0건). 확인 후 삭제.
on:
  push:
    branches: [claude/intelligent-faraday-1pcccm]
    paths: [.github/workflows/probe-kstartup.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import re
          from g2b_notifier.agencies import HTTP, _TIMEOUT, _text
          from g2b_notifier.agencies import _fetch_kised
          print("fetch_kised rows", len(_fetch_kised(3)))
          allorgs = []
          for page in (1, 2, 3):
              b = HTTP.get(f"https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do?page={page}", timeout=_TIMEOUT).text
              b = b[b.find('id="bizPbancList"'):]
              if page == 1:
                  k = b.find("go_view(")
                  print("--- first item markup"); print(b[max(0, k - 300):k + 1800])
              m = re.findall(r"go_view\((\d+)\);'>\s*<div class=\"tit_wrap\">\s*<p class=\"tit\">(.*?)</p>.*?<div class=\"bottom\">(.*?)</div>", b, re.S)
              print("page", page, "regex matches", len(m), "go_view", b.count("go_view("))
              for sn, t, bottom in m:
                  sp = [_text(x) for x in re.findall(r'<span class="list">(.*?)</span>', bottom, re.S)]
                  allorgs.append(sp[1] if len(sp) > 1 else "?")
          print("orgs", allorgs)
          print("kised-like", [o for o in allorgs if "창업진흥" in o])
          PY
