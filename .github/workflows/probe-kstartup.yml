name: Probe K-Startup (temporary)
# 임시(4차): 고친 _fetch_kised가 실제 목록에서 몇 건을 남기는지 확인한다. 확인 후 삭제.
on:
  push:
    branches: [claude/intelligent-faraday-1pcccm]
    paths: [.github/workflows/probe-kstartup.yml, g2b_notifier/agencies.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from g2b_notifier.agencies import _fetch_kised, _fetch_one
          rows = _fetch_one("K-Startup 사업공고(창업진흥원)", lambda: _fetch_kised(5))
          print("kept", len(rows))
          for r in rows:
              print(r["bidNtceDt"], "|", r["ntceInsttNm"], "|", r["bidNtceNm"][:70], "|", r["bidClseDt"])
          PY
