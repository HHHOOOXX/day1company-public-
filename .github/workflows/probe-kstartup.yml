name: Probe K-Startup (temporary)
# 임시(3차): K-Startup 모집중 목록이 지금 어떤 구조로 오는지 확인한다(창업진흥원 수집이 계속 0건). 확인 후 삭제.
on:
  push:
    branches: [claude/intelligent-faraday-1pcccm]
    paths: [.github/workflows/probe-kstartup.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import re
          from g2b_notifier.agencies import HTTP, _TIMEOUT, _text
          b = HTTP.get("https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do?page=1", timeout=_TIMEOUT).text
          b = b[b.find('id="bizPbancList"'):]
          k = b.find('<li class="notice">')
          print("notice li count", b.count('<li class="notice">'))
          print("--- first notice li"); print(re.sub(r"\s+", " ", b[k:k + 3000]))
          for m in re.finditer("창업진흥원", b):
              print("CTX:", re.sub(r"\s+", " ", b[max(0, m.start() - 200):m.start() + 60]))
          PY
