name: G2B Bid Slack Notify (Backup)

# 3중 안전망의 마지막 단계. 1차(외부 크론 → workflow_dispatch)와 2차(notify.yml의 자체 schedule)가
# 둘 다 GitHub Actions 스케줄 지연/스킵으로 안 돌았을 때를 대비한 최종 백업.
# --quiet-if-empty 덕분에, 앞 단계 중 하나라도 이미 정상적으로 발송했다면 오늘 공고는 전부 notified
# 처리돼 있어서 이 워크플로우는 조용히 아무것도 안 보내고 끝난다. 둘 다 안 됐을 때만 대신 발송한다.

on:
  schedule:
    # 12:07 KST = 03:07 UTC, 평일만 실행 (정시 실행 대비 2시간 버퍼)
    - cron: "7 3 * * 1-5"
  workflow_dispatch: {}

# 정시 실행·백업·재조회 실행이 동시에 돌지 않게 한 줄로 세운다(두 워크플로 공통 그룹). 정시 실행이 첨부 재시도로
# 길어져도 백업은 그게 끝나고 DB가 커밋된 뒤에 시작해서, 이미 발송된 날이면 조용히 종료한다(중복 발송 방지).
concurrency:
  group: g2b-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backup notification (quiet if already sent)
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 선택: 봇 토큰+채널 ID가 있으면 카드에 못 넣은 공고를 스레드 댓글로 단다(없으면 본문 맨 아래 목록).
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # 선택: 국내 서버 HTTP 프록시(서울신보 홈페이지가 해외 IP를 막아서 그 사이트 요청만 이걸로 보낸다).
          KR_PROXY_URL: ${{ secrets.KR_PROXY_URL }}
          BIZINFO_SERVICE_KEY: ${{ secrets.BIZINFO_SERVICE_KEY }}
          ALIO_SERVICE_KEY: ${{ secrets.ALIO_SERVICE_KEY }}
          # Drive "[제안 및 검토]" 폴더 → 제안 이력 자동 기록(g2b_notifier/proposals.py). 서비스 계정 키 JSON 전체.
          # 없으면 그 단계만 건너뛴다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python test_g2b_api.py notify 용역 --quiet-if-empty

      - name: Commit updated notifier DB and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notifier.db
          [ -f docs/index.html ] && git add docs/index.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update notifier db + dashboard (backup run) [skip ci]"
          git push
