name: G2B Bid Slack Notify

on:
  schedule:
    # 10:00 KST = 01:00 UTC, 평일(월~금)만 실행
    # 월요일 실행분은 스크립트 로직상 직전 금요일 하루치만 확인함(주말엔 공고가 올라오지 않으므로 토/일 조회 불필요)
    # 참고: 정각(:00)은 전세계적으로 스케줄이 몰려 GitHub Actions가 지연시키는 경우가 있음
    # (실제로 이전 09:00 스케줄이 4시간 넘게 지연되어 13:38에 실행된 사례 있음)
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write  # data/notifier.db 변경사항을 워크플로우가 직접 커밋하기 위해 필요

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily notification
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # ALIO_SERVICE_KEY, BIZINFO_SERVICE_KEY는 키 발급 후 여기에 추가 예정 (아직 discover 모드만 지원)
        run: python test_g2b_api.py notify 용역

      # data/notifier.db(중복 발송 방지용 상태)를 repo에 커밋해서 다음 실행에서도 이어서 쓴다.
      # GitHub Actions엔 영구 서버가 없어서, DB 파일 자체를 git으로 버전관리하는 방식으로 상태를 유지한다.
      - name: Commit updated notifier DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notifier.db
          git diff --cached --quiet && echo "No DB changes to commit" || git commit -m "chore: update notifier db [skip ci]"
          git push
