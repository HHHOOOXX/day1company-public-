name: G2B Bid Slack Notify

on:
  # 정시 발송의 "진짜" 트리거는 외부 크론(cron-job.org 등)이 GitHub REST API로 호출하는
  # workflow_dispatch다. schedule: 트리거는 GitHub 쪽 스케줄 큐 부하에 따라 지연되거나
  # (실제로 이전 09:00 정각 스케줄이 4시간 넘게 지연되어 13:38에 실행된 사례 있음) 아예 안 걸릴 수도
  # 있는 best-effort라, 여기서는 그게 어떤 이유로든 안 됐을 때 대신 보내는 2차 백업 역할만 한다.
  schedule:
    # 10:07 KST = 01:07 UTC, 평일(월~금)만 실행
    # 조회 기간은 직전 발송일(평일·비공휴일)부터 어제까지 — 월요일은 금~일, 연휴 다음 날은 연휴 전 발송일부터(g2b.get_lookback_range)
    # 참고: 정각(:00)은 전세계적으로 스케줄이 몰려 GitHub Actions가 지연시키는 경우가 있어 :07로 분산
    - cron: "7 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack 발송·DB 커밋 없이 수집/필터링만 실행(동작 확인용)"
        type: boolean
        default: false
      from_date:
        description: "놓친 날짜 재조회: 게시일 시작(YYYY-MM-DD). 비우면 기본 기간(직전 발송일~어제)"
        type: string
        default: ""
      to_date:
        description: "놓친 날짜 재조회: 게시일 끝(YYYY-MM-DD). 비우면 시작일 하루"
        type: string
        default: ""

permissions:
  contents: write  # data/notifier.db 변경사항을 워크플로우가 직접 커밋하기 위해 필요

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily notification
        env:
          PYTHONUNBUFFERED: "1"  # 로그 타임스탬프가 실제 진행 시각을 반영하도록(버퍼링 시 전부 끝난 시각으로 찍힘)
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BIZINFO_SERVICE_KEY: ${{ secrets.BIZINFO_SERVICE_KEY }}
          ALIO_SERVICE_KEY: ${{ secrets.ALIO_SERVICE_KEY }}
          # Drive "[제안 및 검토]" 폴더 → 제안 이력 자동 기록(g2b_notifier/proposals.py). 서비스 계정 키 JSON 전체.
          # 없으면 그 단계만 건너뛴다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 대시보드(AX사업기획실 공고목록) 호스팅 방식이 정해지면 그 URL을 시크릿으로 추가하면
          # 슬랙 메시지 마지막에 링크가 자동으로 붙는다. 비어있으면 링크 블록 자체가 생략된다.
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          # 입력값을 셸 스크립트에 직접 끼워 넣지 않고 환경변수로 넘긴다(스크립트 인젝션 방지).
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        # 외부 크론이 부르는 workflow_dispatch는 항상 전체 메시지를 보낸다(진짜 정시 발송).
        # 내부 schedule은 백업이라, 외부 크론이 이미 정상적으로 보냈으면(오늘자 공고가 전부
        # notified 처리돼 있으면) --quiet-if-empty 덕분에 조용히 넘어가고, 안 됐을 때만 대신 보낸다.
        run: |
          RANGE=()
          if [ -n "$FROM_DATE" ]; then
            RANGE=(--from "$FROM_DATE")
            [ -n "$TO_DATE" ] && RANGE+=(--to "$TO_DATE")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python test_g2b_api.py notify 용역 --dry-run "${RANGE[@]}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python test_g2b_api.py notify 용역 --quiet-if-empty
          else
            python test_g2b_api.py notify 용역 "${RANGE[@]}"
          fi

      # data/notifier.db(중복 발송 방지용 상태) + docs/index.html(대시보드)를 repo에 커밋해서
      # 다음 실행에서도 이어서 쓰고, 대시보드도 매일 최신 상태로 유지한다.
      # GitHub Actions엔 영구 서버가 없어서, 파일 자체를 git으로 버전관리하는 방식으로 상태를 유지한다.
      - name: Commit updated notifier DB and dashboard
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notifier.db
          [ -f docs/index.html ] && git add docs/index.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update notifier db + dashboard [skip ci]"
          git push
