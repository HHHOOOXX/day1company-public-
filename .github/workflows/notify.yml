name: G2B Bid Slack Notify

on:
  schedule:
    # 09:00 KST = 00:00 UTC, 평일(월~금)만 실행
    # 월요일 실행분은 스크립트 로직상 금~일 3일치를 함께 확인하므로 주말 실행은 불필요
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily notification
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python test_g2b_api.py notify 용역
