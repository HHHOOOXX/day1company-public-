name: Probe Starbill (temporary)
# 임시: 스타빌(starbill.co.kr) 공고 목록 구조와 인증서 정보를 확인한다. 확인 후 삭제.
on:
  push:
    branches: [claude/intelligent-faraday-1pcccm]
    paths: [.github/workflows/probe-starbill.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo | openssl s_client -connect www.starbill.co.kr:443 -servername www.starbill.co.kr 2>/dev/null | openssl x509 > leaf.pem
          openssl x509 -in leaf.pem -noout -subject -issuer -enddate
          openssl x509 -in leaf.pem -noout -text | grep -A2 "Authority Information Access"
          AIA=$(openssl x509 -in leaf.pem -noout -text | grep -A1 "CA Issuers" | grep -o 'http[^ ]*' | head -1)
          curl -sS -m 30 -o inter.der "$AIA"
          (openssl x509 -inform der -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem)
          echo "--- intermediate"; openssl x509 -in inter.pem -noout -subject -issuer -enddate; cat inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          curl -sS --cacert bundle.pem -L -m 30 -A "Mozilla/5.0" -o home.html https://www.starbill.co.kr/
          echo "--- rows"; grep -c 'ebidEmail.do?orgSeq=' home.html
          python3 - <<'PY'
          import re
          h=open('home.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<tr>\s*<td>\s*(.*?)\s*</td>.*?<td class="left">\s*(.*?)\s*</td>.*?href="(/ebidEmail\.do\?[^"]+)">\s*(.*?)</a>.*?<td class="date">(.*?)</td>', h, re.S):
              print(' | '.join(x.strip() for x in m.groups()))
          i=h.find('topline'); print(h[i-1500:i][:1500])
          PY
